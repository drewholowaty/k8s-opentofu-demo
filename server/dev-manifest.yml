---
apiVersion: v1
kind: Service
metadata:
  name: drewserver-server-load-balancer
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drewserver-server-deployment
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: drewserver-server-c
          imagePullPolicy: IfNotPresent
          image: "host.minikube.internal:5000/drewserver-server-i:latest"
          ports:
            - containerPort: 3000
...
